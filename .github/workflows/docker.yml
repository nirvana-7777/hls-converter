name: Docker Build and Publish - MPEGTS Proxy

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  DOCKER_IMAGE: nirvana777/hls-converter
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest flake8

      - name: "flake8 (blocking: syntax errors, undefined names)"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (advisory)
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: python -m pytest test_mpegts_proxy.py -v
        continue-on-error: true

      - name: Smoke test (startup + /health)
        run: |
          python mpegts-proxy.py > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          if ! curl -fsS --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
               http://127.0.0.1:8000/health; then
            echo "--- app log ---"
            cat /tmp/app.log
            exit 1
          fi

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: "MPEG-TS Stream Proxy - converts HLS/DASH streams to MPEG-TS on the fly"
        continue-on-error: true

  security-scan:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0   # pinned
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}@${{ needs.docker.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'          # non-blocking, but reports real findings
        continue-on-error: false  # don't hide action/network failures

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, docker, security-scan]
    if: always()
    steps:
      - name: Workflow status
        run: |
          echo "Test: ${{ needs.test.result }}  Docker: ${{ needs.docker.result }}  Security: ${{ needs.security-scan.result }}"
          if [[ "${{ needs.test.result }}" == "success" && \
                ( "${{ needs.docker.result }}" == "success" || "${{ needs.docker.result }}" == "skipped" ) && \
                ( "${{ needs.security-scan.result }}" == "success" || "${{ needs.security-scan.result }}" == "skipped" ) ]]; then
            echo "Build completed successfully"
          else
            echo "Build failed - check logs above"
            exit 1
          fi