name: Docker Build and Publish - MPEGTS Proxy

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Manual trigger

env:
  DOCKER_IMAGE: nirvana777/hls-converter
  PYTHON_VERSION: '3.11'  # Changed from 3.9 to match Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-aiohttp pytest-cov flake8  # Changed pytest-flask to pytest-aiohttp

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check FFmpeg availability
        run: |
          ffmpeg -version
          which ffmpeg

      - name: Run tests
        run: |
          # Add your test commands here when you have tests
          # Example: python -m pytest tests/ -v --cov=mpegts-proxy
          echo "⚠️  No tests configured yet"
          echo "✓ Basic validation passed"

      - name: Test aiohttp app startup
        run: |
          # Start the app in background with timeout
          timeout 10 python mpegts-proxy.py &  # Changed from hls-converter.py
          APP_PID=$!
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8000/health || exit 1
          echo "✓ Health check passed"
          
          # Kill the app
          kill $APP_PID 2>/dev/null || true

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: "MPEG-TS Stream Proxy - Convert DASH (MPD) to MPEG-TS streams on-the-fly"  # Updated description
        continue-on-error: true

  security-scan:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, docker, security-scan]
    if: always()

    steps:
      - name: Workflow status
        run: |
          echo "📊 Workflow Summary"
          echo "===================="
          echo "Test job:     ${{ needs.test.result }}"
          echo "Docker job:   ${{ needs.docker.result }}"
          echo "Security job: ${{ needs.security-scan.result }}"
          echo ""
          
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.docker.result }}" == "success" ]]; then
            echo "✅ Build completed successfully!"
            echo "🐳 Image: ${{ env.DOCKER_IMAGE }}"
            echo "🏷️  Tags: latest, ${{ github.sha }}"
          else
            echo "❌ Build failed - check logs above"
            exit 1
          fi

      # Optional: Slack/Discord notification
      # - name: Send notification
      #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     payload: |
      #       {
      #         "text": "MPEG-TS Proxy build ${{ needs.docker.result }}: ${{ github.sha }}"
      #       }