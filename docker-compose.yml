version: '3.8'

services:
  mpegts-proxy:
    image: nirvana777/hls-converter:latest
    container_name: mpegts-proxy
    ports:
      - "8000:8000"
    restart: unless-stopped

    # Health check using wget (available in Alpine)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Optional: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Note: No volumes needed - this is a streaming proxy with no persistent storage
# Configuration is done in code (max_streams, max_stream_age, etc.)