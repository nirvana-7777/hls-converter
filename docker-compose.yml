version: '3.8'

services:
  hls-converter:
    image: nirvana777/hls-converter:latest
    container_name: hls-converter
    ports:
      - "8000:8000"
    volumes:
      - hls_segments:/tmp/hls_segments
    environment:
      # Segment duration in seconds
      - HLS_SEGMENT_DURATION=2
      # Number of segments to keep in playlist
      - HLS_LIST_SIZE=5
      # Cleanup interval in seconds
      - CLEANUP_INTERVAL=300
      # Maximum concurrent streams
      - MAX_STREAMS=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  hls_segments:
    driver: local